INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml

site_name: "Axil Desk"
site_description: "Axil Desk: the desktop GUI application and visual control deck for the Arbora multi-agent ecosystem."
site_url: "https://knuckles-team.github.io/geniusbot/"
repo_name: "Knuckles-Team/geniusbot"
repo_url: "https://github.com/Knuckles-Team/geniusbot"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  ecosystem:
    current: geniusbot
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/geniusbot
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/geniusbot/

nav:
  - Home: index.md
  - Start: start.md
  - Guides:
      - Architecture:
          - Architecture: architecture.md
          - Technical Overview: overview.md
      - Agents: agents.md
      - Apps: apps.md
      - Design system: design-system.md
  - Reference:
      - Features: features.md
      - Knowledge extraction: kg-extraction.md
      - Concept Registry: concepts.md
      - Ecosystem glossary: glossary.md
      - Status: status.md
  - Operate: deployment.md
