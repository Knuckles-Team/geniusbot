INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml

site_name: "geniusbot"
site_description: "GeniusBot — the unified desktop cockpit and visual control deck for the Graph OS multi-agent ecosystem."
site_url: "https://knuckles-team.github.io/geniusbot/"
repo_name: "Knuckles-Team/geniusbot"
repo_url: "https://github.com/Knuckles-Team/geniusbot"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  ecosystem:
    current: geniusbot
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/geniusbot
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/geniusbot/

nav:
  - Home: index.md
  - Architecture:
      - Technical Overview: overview.md
  - Reference:
      - Concept Registry: concepts.md
