site_name: "Geniusbot"
site_description: "PySide6 desktop cockpit for Graph OS agent operations, graph-backed panels, capability workflows, approvals, and terminal access."
site_url: "https://knuckles-team.github.io/geniusbot/"
repo_name: "Knuckles-Team/geniusbot"
repo_url: "https://github.com/Knuckles-Team/geniusbot"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

theme:
  name: material
  custom_dir: overrides
  logo: assets/brands/geniusbot-logo-v1.png
  icon:
    repo: fontawesome/brands/github
  favicon: assets/brands/geniusbot-logo-v1.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  ecosystem:
    current: geniusbot
    sites:
      - slug: geniusbot
        name: Geniusbot
        role: desktop operator cockpit
        url: https://knuckles-team.github.io/geniusbot/
        repository: https://github.com/Knuckles-Team/geniusbot
      - slug: agent-terminal-ui
        name: Agent Terminal UI
        role: terminal operator interface
        url: https://knuckles-team.github.io/agent-terminal-ui/
        repository: https://github.com/Knuckles-Team/agent-terminal-ui
      - slug: agent-webui
        name: Agent Web UI
        role: operator experience
        url: https://knuckles-team.github.io/agent-webui/
        repository: https://github.com/Knuckles-Team/agent-webui
      - slug: graph-os
        name: Graph OS
        role: public runtime gateway
        url: https://knuckles-team.github.io/graph-os/
        repository: https://github.com/Knuckles-Team/graph-os
      - slug: agent-utilities
        name: Agent Utilities
        role: agent control plane
        url: https://knuckles-team.github.io/agent-utilities/
        repository: https://github.com/Knuckles-Team/agent-utilities
      - slug: epistemic-graph
        name: Epistemic Graph
        role: durable multimodal knowledge and reasoning engine
        url: https://knuckles-team.github.io/epistemic-graph/
        repository: https://github.com/Knuckles-Team/epistemic-graph
      - slug: agent-connector-sdk
        name: Agent Connector SDK
        role: governed source integration boundary
        url: https://knuckles-team.github.io/agent-connector-sdk/
        repository: https://github.com/Knuckles-Team/agent-connector-sdk
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/geniusbot
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/geniusbot/

nav:
  - Home: index.md
  - Capabilities: capabilities.md
  - Interfaces: interfaces.md
  - Architecture: overview.md
  - Status: status.md
  - Reference: concepts.md
