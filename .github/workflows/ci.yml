name: CI

# PR: fast gates (Python 3.14 only). Main and nightly: full suite plus the 3.12
# backward-support leg. Publishing lives only in release.yml (v* tag or
# workflow_dispatch). The one required check is `CI required` (reference/ci-standard.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .pre-commit-config.yaml
      test-scope: tests
      setup-command: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libpulse0
        uv sync --frozen --extra test
        printf '%s\n' QT_QPA_PLATFORM=offscreen QT_AUDIO_BACKEND=pulseaudio >> "$GITHUB_ENV"
      # These hooks run scripts from a sibling meristem checkout that a
      # hosted runner does not have; they stay enforced at local pre-push.
      skip-hooks: okf-no-legacy-concepts,lane-guard,check-stubs,check-sprawl,check-coupling,check-lockfile-version-mirrors,source-merge-tests,pytest
      all-files: true
      docs-only-paths: 'specs/** docs/** plans/** *.md **/*.md LICENSE'
      timeout-minutes: 15


  full:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      backward-python: "3.12"
      backward-module: axil
      timeout-minutes: 60
      setup-command: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libpulse0
        uv sync --frozen --extra test
        printf '%s\n' QT_QPA_PLATFORM=offscreen QT_AUDIO_BACKEND=pulseaudio >> "$GITHUB_ENV"

  ci-required:
    name: CI required
    if: always()
    needs: [gates, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
