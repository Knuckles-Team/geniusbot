name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-pages:
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      content_source: docs
      spec_dashboard_enabled: true
      spec_dashboard_config: .github/spec-dashboard.json
