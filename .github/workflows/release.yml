name: Release

# The only publishing path: a v* tag or a manual dispatch. An ordinary push to
# main never reaches this workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    uses: Knuckles-Team/pipelines/.github/workflows/python_pipeline.yml@main
    with:
      require-tag: true
    permissions:
      contents: write
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  release:
    uses: Knuckles-Team/pipelines/.github/workflows/desktop_release_pipeline.yml@main
    permissions:
      contents: write
