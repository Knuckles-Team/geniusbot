[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geniusbot"
version = "3.39.0"
description = "The Ever-learning and ever-improving tool!"
readme = "README.md"
requires-python = ">=3.11, <3.12"
license = { text = "MIT" }
authors = [
    { name = "Audel Rouhi", email = "knucklessg1@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["genius", "geniusbot", "desktop", "qt", "agent", "mcp"]
dependencies = [
    "PySide6>=6.11.1",
    "agent-utilities>=0.45.0",
    "winshell>=0.6; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.15",
    "pytest>=8.0.0",
    "pytest-qt>=4.5.0",
    "mypy>=1.0.0",
    "types-requests",
    "types-docker",
]
test = [
    "ruff>=0.15.15",
    "pytest>=8.0.0",
    "pytest-qt>=4.5.0",
]
types = [
    "mypy>=1.0.0",
    "types-requests",
    "types-docker",
]

[project.urls]
Homepage = "https://github.com/Knuckles-Team/geniusbot"

[project.scripts]
geniusbot = "geniusbot.geniusbot:main"

[tool.hatch.build.targets.wheel]
packages = ["geniusbot"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F841", "F401", "E402"]

[tool.pytest.ini_options]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "concept(name): mark test with a specific concept ID for traceability"
]
