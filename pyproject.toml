[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geniusbot"
version = "5.2.2"
description = "The Ever-learning and ever-improving tool!"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
]
keywords = ["genius", "geniusbot", "desktop", "qt", "agent", "mcp"]
dependencies = [
    "PySide6>=6.12.0",
    "arbora>=0.1.2",
    "epistemic-graph>=2.27.3,<3",
    "platformdirs>=4.3.0",
    "winshell>=0.6; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'"
]

[[project.authors]]
name = "Repository Maintainers"

[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.4.0",
    "types-requests>=2.33.0.20261006",
    "types-docker>=7.2.0.20261006",
]
test = [
    "ruff>=0.17.1",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.4.0",
]
types = [
    "mypy>=2.4.0",
    "types-requests>=2.33.0.20261006",
    "types-docker>=7.2.0.20261006",
]

[project.urls]
Homepage = "https://github.com/Knuckles-Team/geniusbot"

[project.scripts]
geniusbot = "geniusbot.geniusbot:main"
geniusbot-package = "geniusbot.services.packaging_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["geniusbot"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F841", "F401", "E402"]

[tool.pytest.ini_options]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "concept(name): mark test with a specific concept ID for traceability",
    "spec(id): bind a test to a specification row ID"
]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/geniusbot"
distribution = "geniusbot"
pages_url = "https://knuckles-team.github.io/geniusbot/"
mcp_server = false

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["specs/_template/*"]
