version = 1
revision = 3
requires-python = ">=3.12, <3.15"
resolution-markers = [
    "python_full_version >= '3.14'",
    "python_full_version < '3.14'",
]

[[package]]
name = "agent-connector-sdk"
source = { editable = ".uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/agent-connector-sdk" }
dependencies = [
    { name = "anyio" },
    { name = "cryptography" },
    { name = "epistemic-graph" },
    { name = "fastmcp" },
    { name = "httpx" },
    { name = "httpx2" },
    { name = "pydantic" },
    { name = "pyyaml" },
]

[package.metadata]
requires-dist = [
    { name = "anyio", specifier = ">=4.13.0" },
    { name = "cryptography", specifier = ">=50.0.1" },
    { name = "epistemic-graph", specifier = ">=2.27.0,<3" },
    { name = "fastmcp", specifier = ">=4.0.3,<5" },
