default_language_version:
  python: python3
# `git push` must run the FULL gate, not a subset. Without
# `default_install_hook_types`, `pre-commit install` wires ONLY the pre-commit
# hook, so `git push` runs nothing and any hook staged pre-push is dead code.
# `default_stages` then makes every hook that names no stages of its own run at
# BOTH stages, so a push is a strict superset of a commit. Heavy hooks below
# (pytest) carry an explicit `stages: [pre-push, manual]` so they still run
# ONLY at push, never at commit.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
exclude: 'dotnet'
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: 'monthly'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b # v4.5.0
    hooks:
    - id: check-added-large-files
    - id: check-ast
    - id: check-yaml
      args: ["--unsafe"]
    - id: check-toml
    - id: check-json
    - id: check-byte-order-marker
      exclude: .gitignore
    - id: check-merge-conflict
    - id: detect-private-key
    - id: trailing-whitespace
    - id: end-of-file-fixer
  - repo: https://github.com/psf/black
    rev: 552baf822992936134cbd31a38f69c8cfe7c0f05 # 24.3.0
    hooks:
    - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0671d8ab202c4ac093b78433ae5baf74f3fc7246 # v0.15.15
    hooks:
      - id: ruff
        types_or: [ python, pyi, jupyter ]
        args: ["--fix", "--ignore=E402"]
  - repo: https://github.com/codespell-project/codespell
    rev: 6e41aba91fb32e9feb741a6258eefeb9c6e4a482 # v2.2.6
    hooks:
      - id: codespell
        args: ["-L", "ans,linar,nam,tread,ot,"]
        exclude: |
            (?x)^(
              pyproject.toml |
              website/static/img/ag.svg |
              website/yarn.lock |
              website/docs/tutorial/code-executors.ipynb |
              website/docs/topics/code-execution/custom-executor.ipynb |
              website/docs/topics/non-openai-models/cloud-gemini.ipynb |
              notebook/.*
            )$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
    hooks:
    - id: mypy
      additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518, types-setuptools==83.0.0.20260706, PySide6==6.11.1]
      args: ["--ignore-missing-imports"]
  - repo: local
    hooks:
    - id: okf-no-legacy-concepts
      name: OKF-CIS — no legacy CONCEPT ids
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_no_legacy_markers.py" . "$@"' --
      language: system
      pass_filenames: false
      always_run: true
    - id: lane-guard
      name: Lane guard — canonical checkout read-only + stray CARGO_TARGET_DIR (D-CP-3/D-CP-4 reach)
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_lane_guard.py"'
      language: system
      pass_filenames: false
      always_run: true
    - id: check-stubs
      name: Check for Active Stubs and TODOs
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_stubs.py" "$@"' --
      language: system
      types: [python]
    - id: check-sprawl
      name: Guardrail — anti-sprawl
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_sprawl.py" "$@"' --
      language: system
      args: ["."]
      pass_filenames: false
      always_run: true
    - id: check-coupling
      name: Guardrail — geniusbot coupling (adapter seam)
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_coupling.py" "$@"' --
      language: system
      pass_filenames: false
      always_run: true
    - id: check-lockfile-version-mirrors
      # C2 (REMAINING-ISSUES-DESIGNS.md): this repo's generated lock artifacts
      # (uv.lock, requirements.txt) drifted from pyproject.toml with nothing
      # catching it -- requirements.txt pinned an agent-utilities floor a full
      # major version stale (1.0.0 against a >=2.0.0 pyproject.toml floor)
      # because the fleet's version/lockfile edict named uv.lock only. No
      # pre-existing hook in this repo enforces version mirrors (unlike repos
      # with a `check-bumpversion` hook), so this is a new, single gate for
      # both artifacts rather than one per artifact.
      name: Guardrail — lockfile version mirrors (uv.lock/requirements.txt vs pyproject.toml)
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_lockfile_version_mirrors.py" "$@"' --
      language: system
      args: ["."]
      pass_filenames: false
      always_run: true
    - id: pytest
      name: pytest
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else au_d="$repo"; root=""; while [ "$au_d" != "/" ]; do if [ -d "$au_d/agent-utilities/scripts" ]; then root="$au_d/agent-utilities"; break; fi; au_d=$(dirname "$au_d"); done; fi; if [ -d "$root" ] && [ "$repo" != "$root" ]; then mkdir -p .uv-workspace-siblings && ln -sfn "$root" .uv-workspace-siblings/agent-utilities; fi; export QT_QPA_PLATFORM=offscreen; test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; if [ -f uv.lock ]; then uv run --all-extras pytest "$test_target" -q --tb=short -m "not slow and not integration" --timeout=60; else pytest "$test_target" -q --tb=short -m "not slow and not integration" --timeout=60; fi'
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
      stages: [pre-push, manual]
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 15ef9f32df9026032db2d61d944801358271de69 # 1.8.5
    hooks:
      - id: nbqa-black
  - repo: local
    hooks:
    - id: security-sanitizer
      name: Security and Garbage Sanitizer
      entry: python scripts/security_sanitizer.py
      language: python
      pass_filenames: false
      always_run: true
