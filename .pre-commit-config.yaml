default_language_version:
  python: python3
# Push runs mandatory tests: focused same-main comparison for the bounded
# gateway source scope, full pytest otherwise. Without
# `default_install_hook_types`, `pre-commit install` wires ONLY the pre-commit
# hook, so `git push` runs nothing and any hook staged pre-push is dead code.
# `default_stages` then makes every hook that names no stages of its own run at
# BOTH stages. The source-merge-tests push hook selects the test scope;
# the full pytest hook remains available for manual and release qualification.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
exclude: 'dotnet'
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: 'monthly'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    - id: check-added-large-files
    - id: check-ast
    - id: check-yaml
      args: ["--unsafe"]
    - id: check-toml
    - id: check-json
    - id: fix-byte-order-marker
      exclude: .gitignore
    - id: check-merge-conflict
    - id: detect-private-key
    - id: trailing-whitespace
    - id: end-of-file-fixer
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc # 26.10.1
    hooks:
    - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
    hooks:
      - id: ruff
        types_or: [ python, pyi, jupyter ]
        args: ["--fix", "--ignore=E402"]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell
        args: ["-L", "ans,linar,nam,tread,ot,"]
        exclude: |
            (?x)^(
              pyproject.toml |
              website/static/img/ag.svg |
              website/yarn.lock |
              website/docs/tutorial/code-executors.ipynb |
              website/docs/topics/code-execution/custom-executor.ipynb |
              website/docs/topics/non-openai-models/cloud-gemini.ipynb |
              notebook/.*
            )$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # v2.4.0
    hooks:
    - id: mypy
      additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518, types-setuptools==83.0.0.20260706, PySide6==6.11.1]
      args: ["--ignore-missing-imports"]
  - repo: https://github.com/Knuckles-Team/pipelines
    rev: main
    hooks:
    - id: spec
    - id: secrets
    - id: no-legacy-concepts
    - id: coupling
      args: ["--root", "."]
    - id: lockfile-version-mirrors
      args: ["--root", "."]
      always_run: false
      files: '(^|/)(pyproject\.toml|uv\.lock|requirements[^/]*\.txt|setup\.(py|cfg))$'
  - repo: https://github.com/Knuckles-Team/repository-manager
    rev: 09e91390d446950d345304c7a05fb69d86fdca8b
    hooks:
    - id: lane-guard
  - repo: local
    hooks:
    - id: dependency-readiness
      name: Dependency readiness — every declared intra-fleet constraint is installable
      entry: bash -c 'P=""; d="$PWD"; while [ "$d" != "/" ]; do [ -d "$d/agent-packages/agents/repository-manager" ] && { P="$d/agent-packages/agents/repository-manager"; break; }; d=$(dirname "$d"); done; [ -n "$P" ] || P=repository-manager; uv run --no-project --python 3.14 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .'
      language: system
      pass_filenames: false
      always_run: false
      files: '(^|/)(pyproject\.toml|uv\.lock|requirements[^/]*\.txt|setup\.(py|cfg))$'
      # Report-only (gate cut 2026-10-17): the published repository-manager
      # imports meristem modules that 3.x removed, so the hook cannot run.
      stages: [manual]
    - id: pytest
      name: pytest
      entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else au_d="$repo"; root=""; while [ "$au_d" != "/" ]; do if [ -d "$au_d/meristem/scripts" ]; then root="$au_d/meristem"; break; fi; au_d=$(dirname "$au_d"); done; fi; if [ -d "$root" ] && [ "$repo" != "$root" ]; then mkdir -p .uv-workspace-siblings && ln -sfn "$root" .uv-workspace-siblings/meristem; fi; export QT_QPA_PLATFORM=offscreen; test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; if [ -f uv.lock ]; then uv run --all-extras pytest "$test_target" -q --tb=short -m "not slow and not integration" --timeout=60; else pytest "$test_target" -q --tb=short -m "not slow and not integration" --timeout=60; fi'
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
      stages: [manual]
    - id: source-merge-tests
      name: Mandatory source tests against current main (full pytest outside gateway scope)
      entry: python3 scripts/check_source_merge.py
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]
  - repo: https://github.com/nbQA-dev/nbQA
    rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
    hooks:
      - id: nbqa-black
  - repo: local
    hooks:
    - id: guardrail-tracked-privacy
      name: Guardrail — tracked public artifacts contain no host-specific data or local identities
      entry: python3 scripts/check_tracked_privacy.py
      language: system
      # NOT scoped, despite being expensive: a privacy leak (hostname, local
      # path, identity) can land in ANY tracked file type (docs, config,
      # fixtures), not just one directory, so no `files:` regex narrower
      # than "everything tracked" can be proven not to miss one. Ported from
      # meristem' identically-named/identically-behaved gate
      # (`scripts/check_tracked_privacy.py`'s own module docstring notes the
      # one intentional adaptation: this repo's own top-level source trees,
      # not meristem'). This repo publishes to a public GitHub org,
      # same as meristem.
      pass_filenames: false
      always_run: true
